[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geo-seo-hub"
version = "0.5.0"
description = "Experimental, GEO-first agent skill hub with an SEO-ready architecture"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = {text = "AGPL-3.0-only"}
authors = [{name = "姚金刚 / Yao"}]
dependencies = [
  "jsonschema>=4.21,<5",
  "PyYAML>=6.0,<7",
]

[project.urls]
Homepage = "https://github.com/yaojingang/geo-seo-hub"
Repository = "https://github.com/yaojingang/geo-seo-hub"

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "setuptools>=68",
]
render = [
  "python-docx>=1.1,<2",
  "weasyprint>=62,<70",
  "reportlab>=4,<5",
]

[project.scripts]
geo-seo-hub = "geo_seo_hub.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/geo-seo-hub/skills" = ["skills/RESOLVER.md"]
"share/geo-seo-hub/registry" = [
  "registry/research-evidence.json",
  "registry/skills.yaml",
  "registry/skills.schema.json",
]
