<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>GEOHub 常见问题与支持</title><meta name="description" content="网站 GEO 诊断的输入、范围、评分和数据处理常见问题。"><link rel="canonical" href="https://demo.geohub.invalid/faq"><script type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[]}</script></head><body><nav><a href="/">首页</a><a href="/about">联系</a><a href="/product/atlas">产品</a><a href="/docs/grounding">指南</a><a href="/pricing">价格</a></nav><main><article><h1>常见问题与支持</h1><h2>诊断需要什么输入？</h2><p>提供一个公开 HTTP 或 HTTPS 网址。系统在同一主机内发现页面，最多分析 10 个典型页面。</p><h2>评分代表什么？</h2><p>评分描述页面快照中的可访问性、架构、实体、答案、证据、信任、结构和新鲜度信号。它不表示真实 AI 排名或引用次数。</p><h2>如何处理抓取缺口？</h2><p>robots 阻断、超时或浏览器缺失会记录为 source_gap 或 render_gap，并降低诊断置信度。</p><h2>如何联系维护者？</h2><p>演示站由 GEOHub 质量团队维护。作者与审核信息记录在关于页面，更新于 2026-08-23。</p><p><a href="https://www.rfc-editor.org/rfc/rfc9309">Robots 协议来源</a><a href="https://www.w3.org/WAI/">可访问性来源</a></p></article></main></body></html>
