interface:
  display_name: "GEO SEO Hub Measure"
  short_description: "Measure imported GEO engine observations with auditable metrics"
  default_prompt: "Use $geo-measure to measure this approved engine observation bundle under the selected runs root."
  input_contract:
    required: {bundle: "protocol 1.0.0 file-backed engine observation bundle JSON"}
  output_contract: ["Artifact Bus run directory", "visibility-report", "quality-report", "run-manifest"]
  permission_contract: {filesystem: "read bundle and write selected runs root", network: "forbid"}
compatibility:
  canonical_format: "agent-skills"
  adapter_targets: [openai, claude, generic]
  activation: {mode: "auto", paths: []}
  execution: {context: "inline", shell: "bash"}
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow-metadata-only"
  degradation:
    openai: "metadata-adapter"
    claude: "neutral-source-plus-adapter"
    generic: "neutral-source"
