interface:
  display_name: "GEO SEO Hub Discover"
  short_description: "Build deterministic evidence-aware GEO discovery artifacts"
  default_prompt: "Use $geo-discover to create an evidence-aware query and opportunity map from this brief under the requested runs root."
  input_contract:
    required: {brief: "protocol 1.0.0 file-backed GEO brief JSON"}
  output_contract: ["Artifact Bus run directory", "query-map", "opportunity-map", "evidence-ledger", "research-context", "quality-report", "run-manifest"]
  permission_contract: {filesystem: "read brief and write selected runs root", network: "forbid"}
compatibility:
  canonical_format: "agent-skills"
  adapter_targets: [openai, claude, generic]
  activation:
    mode: "auto"
    paths: []
  execution:
    context: "inline"
    shell: "bash"
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow-metadata-only"
  degradation:
    openai: "metadata-adapter"
    claude: "neutral-source-plus-adapter"
    generic: "neutral-source"
