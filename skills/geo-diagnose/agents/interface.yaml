interface:
  display_name: "GEO SEO Hub Diagnose"
  short_description: "Diagnose brand, site, and page GEO gaps with evidence lineage"
  default_prompt: "Use $geo-diagnose to assess this brand, site, or page from the explicit sources and preserve all source gaps and limitations."
  input_contract:
    required:
      subject: "non-blank string"
      scope: "brand | site | page"
    optional:
      target_urls: "up to five explicit public HTTP(S) canonical URLs without query strings"
      source_html: "one inline HTML/file snapshot object or an array of up to five snapshot objects"
      evidence: "array of unique input labels with claim and canonical source_uri; output IDs are content-derived"
      locale: "non-blank string"
      audience: "non-blank string"
      goals: "array of non-blank strings"
    source_requirement: "at least one of target_urls, source_html, or evidence"
  output_contract:
    - "input/diagnosis-brief.json"
    - "input/sources/*.html"
    - "diagnosis.json"
    - "report.md"
    - "evidence-ledger.json"
    - "query-map.json"
    - "opportunity-map.json"
    - "quality-report.json"
    - "run-lineage.json"
    - "run-manifest.json"
  permission_contract: {filesystem: "read inputs and write selected runs root", network: "explicit public HTTP(S) source URLs only"}
compatibility:
  canonical_format: "agent-skills"
  adapter_targets: [openai, claude, generic]
  activation:
    mode: "auto"
    paths: []
  execution:
    context: "inline"
    shell: "bash"
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow-metadata-only"
  degradation:
    openai: "metadata-adapter"
    claude: "neutral-source-plus-adapter"
    generic: "neutral-source"
