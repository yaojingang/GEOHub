interface:
  display_name: "GEO SEO Hub Knowledge"
  short_description: "Build source-lined knowledge graphs with conflict preservation"
  default_prompt: "Use $geo-knowledge to build and query a governed graph from these approved source bundles."
  input_contract:
    required: {request: "protocol 1.0.0 file-backed knowledge request JSON"}
  output_contract: ["Artifact Bus run directory", "knowledge graph", "knowledge query result", "evidence ledger", "quality report", "run lineage", "run manifest"]
  permission_contract: {filesystem: "read request and write selected runs root", network: "forbid"}
compatibility:
  canonical_format: "agent-skills"
  adapter_targets: [openai, claude, generic]
  activation: {mode: "auto", paths: []}
  execution: {context: "inline", shell: "bash"}
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow-metadata-only"
  degradation:
    openai: "metadata-adapter"
    claude: "neutral-source-plus-adapter"
    generic: "neutral-source"
