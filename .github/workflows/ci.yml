name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: python scripts/verify_repository.py
      - run: python scripts/run_yao_meta_gates.py --verify-existing
      - run: python -m pytest
      - run: python scripts/run_evals.py
      - run: python scripts/package.py --target all --channel community
      - run: python scripts/verify_packages.py

  visual-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e '.[dev,render]'
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/generate_site_diagnose_demo.py
      - run: python scripts/capture_site_diagnose_demo.py
      - uses: actions/upload-artifact@v4
        with:
          name: geo-site-diagnose-visual-report
          path: |
            reports/examples/geo-site-diagnose-demo.html
            reports/examples/geo-site-diagnose-demo-desktop.png
            reports/examples/geo-site-diagnose-demo-mobile.png

  macos-install:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: python scripts/package.py --target all --channel community
      - run: python scripts/verify_packages.py
      - run: python scripts/install_simulation.py --target all
