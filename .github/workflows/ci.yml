name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: python scripts/verify_repository.py
      - run: python scripts/run_yao_meta_gates.py --verify-existing
      - run: python -m pytest
      - run: python scripts/run_evals.py
      - run: python scripts/package.py --target all --channel community
      - run: python scripts/verify_packages.py

  macos-install:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: python scripts/package.py --target all --channel community
      - run: python scripts/verify_packages.py
      - run: python scripts/install_simulation.py --target all
