name: Attested release build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: ""
      - name: Match tag to VERSION
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: test "${GITHUB_REF_NAME}" = "v$(cat VERSION)"
      - run: python -m pip install --require-hashes -r requirements-ci.lock
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: python scripts/verify_all.py
      - name: Record release artifact digests
        shell: bash
        run: sha256sum dist/*.zip reports/release-*.json reports/production-readiness.json reports/production-readiness.md > release-digests.sha256
      - name: Upload immutable build output
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: geo-seo-hub-unattested-release
          path: |
            dist/*.zip
            reports/release-sbom.json
            reports/release-provenance.json
            reports/release-provenance-verification.json
            reports/production-readiness.json
            reports/production-readiness.md
            release-digests.sha256
          if-no-files-found: error
          retention-days: 7

  attest:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download immutable build output
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: geo-seo-hub-unattested-release
      - name: Verify transferred artifact digests
        run: sha256sum --check release-digests.sha256
      - name: Attest release ZIPs
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: "dist/*.zip"
      - name: Upload attested ZIPs and release evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: geo-seo-hub-attested-release
          path: |
            dist/*.zip
            reports/release-sbom.json
            reports/release-provenance.json
            reports/release-provenance-verification.json
            reports/production-readiness.json
            reports/production-readiness.md
            release-digests.sha256
          if-no-files-found: error
